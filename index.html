        /* =========================

        .navbar {
            position: fixed;
            top: 0;

            color: white;

        }

        .notice {
            position: fixed;

        }

            width: 100%;
            overflow: hidden;
        }

        .text {
            display: inline-block;

            white-space: nowrap;

            font-size: 24px;
            font-weight: bold;

            background: linear-gradient(
                90deg,
                red,
                orange,
                yellow,
                lime,
                cyan,
                blue,
                violet,
                red
            );

            background-size: 400%;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:
                scroll 10s linear infinite,
                rainbow 3s linear infinite;

            filter:
                drop-shadow(0 0 5px cyan)
                drop-shadow(0 0 10px magenta);
        }

        @keyframes scroll {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(-100%);
            }
        }

        @keyframes rainbow {
            from {
                background-position: 0%;
            }

            to {
                background-position: 400%;
            }
        }

.stars span:nth-child(1) {

}

}

.stars span:nth-child(3) {
